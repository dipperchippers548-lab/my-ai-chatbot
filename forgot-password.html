<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - VANTAGE 4o</title>
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="logo">VANTAGE 4o</h1>
                <p class="tagline">Reset your password</p>
            </div>

            <div id="resetStep1" class="reset-step">
                <form id="forgotForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email address">
                    </div>

                    <button type="submit" class="auth-button primary">Send reset link</button>
                </form>

                <div class="auth-footer">
                    <p><a href="login.html">Back to sign in</a></p>
                </div>
            </div>

            <div id="resetStep2" class="reset-step" style="display: none;">
                <div class="success-message">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4" />
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
                    </svg>
                    <h3>Check your email</h3>
                    <p>We've sent a password reset link to your email address.</p>
                    
                    <div id="devResetSection" class="dev-reset" style="display: none;">
                        <p class="dev-note">Development mode - Click below to reset:</p>
                        <button id="devResetBtn" class="auth-button secondary">Reset Password (Dev)</button>
                    </div>
                </div>

                <div class="auth-footer">
                    <p><a href="login.html">Back to sign in</a></p>
                </div>
            </div>

            <div id="resetStep3" class="reset-step" style="display: none;">
                <form id="resetForm" class="auth-form">
                    <input type="hidden" id="resetToken" name="resetToken">
                    
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword" required>
                        <div class="password-strength">
                            <div class="strength-bar"></div>
                            <span class="strength-text">Use 8+ characters</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>

                    <button type="submit" class="auth-button primary">Update Password</button>
                </form>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/auth.js"></script>
</body>
</html>
